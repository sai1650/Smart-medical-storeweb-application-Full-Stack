<!DOCTYPE html>
<html>
<head>
  <title>API Test</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    .test { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
    pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>API Test</h1>
  
  <div class="test">
    <h2>Test 1: /medicines/summary</h2>
    <button onclick="testSummary()">Test</button>
    <pre id="summary-result">Waiting...</pre>
  </div>
  
  <div class="test">
    <h2>Test 2: /medicines?page=1&limit=50</h2>
    <button onclick="testMedicines()">Test</button>
    <pre id="medicines-result">Waiting...</pre>
  </div>

  <script src="env.js"></script>
  <script src="script.js"></script>
  <script>
    async function testSummary() {
      try {
        const res = await fetch(`${API}/medicines/summary`);
        const data = await res.json();
        document.getElementById('summary-result').innerText = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById('summary-result').innerText = 'Error: ' + err.message;
      }
    }

    async function testMedicines() {
      try {
        const res = await fetch(`${API}/medicines?page=1&limit=50`);
        const data = await res.json();
        document.getElementById('medicines-result').innerText = 
          JSON.stringify({
            dataCount: data.data?.length,
            total: data.total,
            page: data.page,
            totalPages: data.totalPages,
            firstItem: data.data?.[0] || null
          }, null, 2);
      } catch (err) {
        document.getElementById('medicines-result').innerText = 'Error: ' + err.message;
      }
    }

    // Auto-test on page load
    window.addEventListener('load', () => {
      testSummary();
      testMedicines();
    });
  </script>
</body>
</html>
